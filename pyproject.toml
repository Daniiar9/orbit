[project]
name = "orbit-mcp"
version = "0.1.0"
description = "Relationship timing intelligence for genuine pipeline building. Open source MCP server."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Daniiar Sher"}]
keywords = ["mcp", "linkedin", "gtm", "sales", "relationship-intelligence"]
dependencies = [
    "fastmcp>=2.0.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "openai>=1.0.0",
    "exa-py>=1.0.0",
    "patchright>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
orbit = "orbit.server:main"
orbit-login = "orbit.services.linkedin:login"

[tool.hatch.build.targets.wheel]
packages = ["orbit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
